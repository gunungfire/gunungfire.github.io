<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Pantau status Gunung Anak Krakatau, dampak erupsi, dan panduan tindakan secara real time."
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pantau Gunung" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Pantau Gunung Berapi — Anak Krakatau</title>
    <script>
      /*
       * Tema dipasang sebelum gambar pertama. Kalau menunggu React, layar
       * sempat berkedip gelap dulu bagi orang yang memilih tema terang.
       * Nama kuncinya harus sama dengan yang di src/hooks/useTheme.ts.
       */
      ;(function () {
        try {
          var pilihan = localStorage.getItem('pantau.tema')
          var terang =
            pilihan === 'terang' ||
            (pilihan !== 'gelap' &&
              window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute(
            'data-theme',
            terang ? 'terang' : 'gelap',
          )
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', terang ? '#f6f8fb' : '#0d1117')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'gelap')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
